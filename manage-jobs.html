<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Jobs — WorkWay Recruiter Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .page-wrapper { padding: 100px 0 80px; }
      .jobs-table { width: 100%; border-collapse: collapse; }
      .jobs-table th { padding: 12px 16px; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border-subtle); background: var(--bg-card-subtle); }
      .jobs-table td { padding: 16px; border-bottom: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary); vertical-align: middle; }
      .jobs-table tr:hover td { background: var(--bg-card-subtle); }
      .badge { display: inline-block; padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.78rem; font-weight: 700; }
      .badge-active { background: #dcfce7; color: #15803d; }
      .badge-inactive { background: #fee2e2; color: #b91c1c; }
      .badge-draft { background: #f1f5f9; color: var(--text-muted); }
      .action-btns { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <header class="site-header scrolled">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="recruiter-dashboard.html">Dashboard</a>
          <a href="post-job.html">Post Job</a>
          <a href="candidate-search.html">Find Candidates</a>
          <a href="messages.html">Messages</a>
        </nav>
        <div class="nav-actions"></div>
      </div>
    </header>

    <main class="page-wrapper">
      <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
          <div>
            <h1 style="font-size:1.8rem;font-weight:800;color:var(--text-primary);">Manage Job Listings</h1>
            <p style="color:var(--text-muted);font-size:0.9rem;">View, edit, activate, or archive all your company's job postings</p>
          </div>
          <a href="post-job.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Post New Job</a>
        </div>

        <div class="card-standard" style="padding:0;overflow:hidden;">
          <div id="tableContainer">
            <div style="padding:40px;text-align:center;color:var(--text-muted);">
              <div class="skeleton skel-row" style="width:100%;height:48px;margin-bottom:10px;border-radius:6px;"></div>
              <div class="skeleton skel-row" style="width:100%;height:48px;margin-bottom:10px;border-radius:6px;"></div>
              <div class="skeleton skel-row" style="width:100%;height:48px;border-radius:6px;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase } from './js/supabase-config.js';
      import { AuthService } from './js/services/auth.service.js';

      let currentUser, company;

      document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await AuthService.getCurrentProfile();
        if (!currentUser) { window.location.href = 'login.html'; return; }

        company = await AuthService.getRecruiterCompany(currentUser.id);
        if (!company) { window.location.href = 'recruiter-onboarding.html'; return; }

        await loadJobs();
      });

      async function loadJobs() {
        const { data: jobs } = await supabase.from('jobs')
          .select('*, job_applications(id)')
          .eq('company_id', company.id)
          .order('created_at', { ascending: false });

        const container = document.getElementById('tableContainer');

        if (!jobs || jobs.length === 0) {
          container.innerHTML = `
            <div style="padding:60px;text-align:center;color:var(--text-muted);">
              <i class="fa-solid fa-briefcase" style="font-size:2.5rem;opacity:0.3;margin-bottom:14px;"></i>
              <p>No job listings yet. Post your first job to start hiring!</p>
              <a href="post-job.html" class="btn btn-primary" style="margin-top:16px;">Post a Job</a>
            </div>`;
          return;
        }

        container.innerHTML = `
          <table class="jobs-table">
            <thead>
              <tr>
                <th>Job Title</th>
                <th>Category</th>
                <th>Location</th>
                <th>Applications</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${jobs.map(job => `
                <tr>
                  <td>
                    <div style="font-weight:700;color:var(--text-primary);">${job.title}</div>
                    <div style="font-size:0.78rem;color:var(--text-muted);">${job.job_type?.replace('_',' ')} &bull; ${job.work_mode?.replace('_',' ')}</div>
                  </td>
                  <td>${job.category || '—'}</td>
                  <td>${job.location}</td>
                  <td style="text-align:center;">
                    <strong style="color:var(--brand-blue);">${job.job_applications?.length || 0}</strong>
                  </td>
                  <td>
                    <span class="badge ${job.is_active ? 'badge-active' : 'badge-inactive'}">
                      ${job.is_active ? 'Active' : 'Inactive'}
                    </span>
                  </td>
                  <td>
                    <div class="action-btns">
                      <button class="btn btn-secondary" onclick="toggleJobStatus('${job.id}', ${job.is_active})" style="padding:6px 12px;font-size:0.78rem;background:transparent;border-color:var(--border-color);color:var(--text-secondary);">
                        ${job.is_active ? 'Pause' : 'Activate'}
                      </button>
                      <button class="btn btn-secondary" onclick="viewApps('${job.id}')" style="padding:6px 12px;font-size:0.78rem;">
                        View Applicants
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      window.toggleJobStatus = async function(jobId, currentActive) {
        await supabase.from('jobs').update({ is_active: !currentActive }).eq('id', jobId);
        await loadJobs();
      };

      window.viewApps = function(jobId) {
        window.location.href = `candidate-search.html?job=${jobId}`;
      };
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
