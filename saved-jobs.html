<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Jobs — WorkWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .page-wrapper { padding: 100px 0 80px; }
      .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
      .saved-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: var(--shadow-sm);
        transition: all var(--transition-normal);
        position: relative;
      }
      .saved-card:hover { border-color: var(--brand-blue); box-shadow: var(--shadow-md); transform: translateY(-2px); }
      .unsave-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        border: none;
        font-size: 1rem;
        color: var(--brand-gold);
        cursor: pointer;
        transition: transform var(--transition-fast);
      }
      .unsave-btn:hover { transform: scale(1.2); }
    </style>
  </head>
  <body>
    <header class="site-header scrolled">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="jobseeker-dashboard.html">Dashboard</a>
          <a href="jobs.html">Find Jobs</a>
          <a href="my-applications.html">Applications</a>
          <a href="profile.html">My Profile</a>
        </nav>
        <div class="nav-actions"></div>
      </div>
    </header>

    <main class="page-wrapper">
      <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
          <div>
            <h1 style="font-size:1.8rem;font-weight:800;color:var(--text-primary);">Saved Jobs</h1>
            <p style="color:var(--text-muted);font-size:0.9rem;">Jobs you've bookmarked for later consideration</p>
          </div>
        </div>
        <div class="saved-grid" id="savedGrid">
          <!-- Skeleton -->
          <div class="saved-card"><div class="skeleton skel-row" style="width:60%;height:14px;margin-bottom:10px;"></div><div class="skeleton skel-row" style="width:40%;height:11px;"></div></div>
          <div class="saved-card"><div class="skeleton skel-row" style="width:60%;height:14px;margin-bottom:10px;"></div><div class="skeleton skel-row" style="width:40%;height:11px;"></div></div>
          <div class="saved-card"><div class="skeleton skel-row" style="width:60%;height:14px;margin-bottom:10px;"></div><div class="skeleton skel-row" style="width:40%;height:11px;"></div></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase } from './js/supabase-config.js';
      import { AuthService } from './js/services/auth.service.js';

      document.addEventListener('DOMContentLoaded', async () => {
        const user = await AuthService.getCurrentProfile();
        if (!user) { window.location.href = 'login.html'; return; }

        const { data } = await supabase
          .from('saved_jobs')
          .select(`*, jobs(id, title, location, job_type, salary_min, salary_max, salary_currency, work_mode, skills_required, companies(name))`)
          .eq('user_id', user.id)
          .order('created_at', { ascending: false });

        const grid = document.getElementById('savedGrid');

        if (!data || data.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">
              <i class="fa-solid fa-bookmark" style="font-size:2.5rem;opacity:0.3;margin-bottom:14px;"></i>
              <p>No saved jobs yet. Explore opportunities and save the ones you're interested in!</p>
              <a href="jobs.html" class="btn btn-primary" style="margin-top:16px;">Find Jobs</a>
            </div>`;
          return;
        }

        grid.innerHTML = data.map(saved => {
          const job = saved.jobs || {};
          const company = job.companies || {};
          const fmt = (n) => n >= 1000000 ? `${(n/1000000).toFixed(1)}M` : `${Math.round(n/1000)}K`;

          return `
            <div class="saved-card" id="saved-${saved.id}">
              <button class="unsave-btn" onclick="unsave('${saved.id}', '${saved.job_id}')" title="Remove from Saved">
                <i class="fa-solid fa-bookmark"></i>
              </button>
              <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">${job.job_type?.replace('_',' ') || ''} &bull; ${job.work_mode?.replace('_',' ') || ''}</div>
              <div style="font-weight:700;font-size:1rem;color:var(--text-primary);margin-bottom:4px;">${job.title || 'Job Title'}</div>
              <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:14px;">${company.name || 'Company'} &bull; ${job.location || ''}</div>
              <div style="font-size:0.9rem;font-weight:700;color:var(--text-primary);margin-bottom:16px;">
                ${fmt(job.salary_min || 0)} – ${fmt(job.salary_max || 0)} ${job.salary_currency || 'XAF'}/mo
              </div>
              <a href="jobs.html?id=${job.id}" class="btn btn-primary" style="width:100%;text-align:center;">Apply Now</a>
            </div>
          `;
        }).join('');
      });

      window.unsave = async function(savedId, jobId) {
        await supabase.from('saved_jobs').delete().eq('id', savedId);
        document.getElementById(`saved-${savedId}`)?.remove();
      };
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
