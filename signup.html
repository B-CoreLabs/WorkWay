<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Create Your WorkWay Account</title>
    <!-- Non-blocking Google Fonts with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .auth-wrapper {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px;
      }
      .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 540px;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }
      .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-gold) 100%);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .auth-header p {
        font-size: 0.92rem;
        color: var(--text-muted);
      }
      .role-selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: var(--bg-card-subtle);
        padding: 6px;
        border-radius: var(--radius-md);
        margin-bottom: 24px;
      }
      .role-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border: none;
        background: transparent;
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .role-btn.active {
        background: var(--bg-surface);
        color: var(--brand-blue);
        box-shadow: var(--shadow-sm);
      }
      .oauth-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-surface);
        border-radius: var(--radius-md);
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-primary);
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .oauth-btn:hover {
        border-color: var(--brand-blue);
        box-shadow: var(--shadow-sm);
      }
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: var(--text-muted);
        font-size: 0.82rem;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--border-subtle);
      }
      .divider span {
        padding: 0 12px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-secondary);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--border-subtle);
        background: var(--bg-input);
        color: var(--text-primary);
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        outline: none;
      }
      .form-control:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 4px rgba(1, 69, 178, 0.12);
      }
      .auth-alert {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        font-size: 0.88rem;
        margin-bottom: 20px;
        display: none;
        line-height: 1.5;
      }
      .auth-alert.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        display: block;
      }
      .auth-alert.success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        display: block;
      }
      .auth-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .auth-footer a {
        color: var(--brand-blue);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Standard Header -->
    <header class="site-header">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="jobs.html" data-i18n="nav_find_jobs">Find Jobs</a>
          <a href="recruiter.html" data-i18n="nav_recruiters">For Recruiters</a>
          <a href="how.html" data-i18n="nav_how_it_works">How It Works</a>
          <a href="resources.html" data-i18n="nav_resources">Career Resources</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-secondary">Log In</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Join WorkWay</h1>
          <p>Create your account and unlock AI-powered career matching</p>
        </div>

        <!-- 2-Step Flow: Step 1 Role Selection -->
        <div class="role-selector">
          <button type="button" class="role-btn active" id="btnSeeker">
            <i class="fa-solid fa-user-graduate"></i> Job Seeker
          </button>
          <button type="button" class="role-btn" id="btnRecruiter">
            <i class="fa-solid fa-briefcase"></i> Employer / Recruiter
          </button>
        </div>

        <!-- OAuth Sign-In Buttons -->
        <div class="oauth-buttons">
          <button type="button" class="oauth-btn" id="btnGoogleOAuth">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
          </button>
          <button type="button" class="oauth-btn" id="btnLinkedinOAuth">
            <i class="fa-brands fa-linkedin" style="color: #0077b5;"></i> LinkedIn
          </button>
        </div>

        <div class="divider">
          <span>Or register with email</span>
        </div>

        <div id="authAlert" class="auth-alert"></div>

        <!-- Step 2: Credentials Form -->
        <form id="signupForm">
          <input type="hidden" id="roleInput" value="job_seeker" />

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="e.g. Samuel Eto'o" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required />
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 14px;">
            Create Free Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Log In here</a>
        </div>
      </div>
    </main>

    <script type="module">
      import { AuthService } from './js/services/auth.service.js';

      const btnSeeker = document.getElementById('btnSeeker');
      const btnRecruiter = document.getElementById('btnRecruiter');
      const roleInput = document.getElementById('roleInput');
      const signupForm = document.getElementById('signupForm');
      const submitBtn = document.getElementById('submitBtn');
      const authAlert = document.getElementById('authAlert');
      const btnGoogleOAuth = document.getElementById('btnGoogleOAuth');
      const btnLinkedinOAuth = document.getElementById('btnLinkedinOAuth');

      btnSeeker.addEventListener('click', () => {
        btnSeeker.classList.add('active');
        btnRecruiter.classList.remove('active');
        roleInput.value = 'job_seeker';
      });

      btnRecruiter.addEventListener('click', () => {
        btnRecruiter.classList.add('active');
        btnSeeker.classList.remove('active');
        roleInput.value = 'recruiter';
      });

      btnGoogleOAuth.addEventListener('click', async () => {
        try {
          btnGoogleOAuth.disabled = true;
          await AuthService.signInWithOAuth('google', roleInput.value);
        } catch (err) {
          authAlert.className = 'auth-alert error';
          authAlert.style.display = 'block';
          authAlert.textContent = err.message || 'Google sign in failed.';
          btnGoogleOAuth.disabled = false;
        }
      });

      btnLinkedinOAuth.addEventListener('click', async () => {
        try {
          btnLinkedinOAuth.disabled = true;
          await AuthService.signInWithOAuth('linkedin', roleInput.value);
        } catch (err) {
          authAlert.className = 'auth-alert error';
          authAlert.style.display = 'block';
          authAlert.textContent = err.message || 'LinkedIn sign in failed.';
          btnLinkedinOAuth.disabled = false;
        }
      });

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authAlert.className = 'auth-alert';
        authAlert.style.display = 'none';

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = roleInput.value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating account...';

        try {
          const data = await AuthService.signUp({ email, password, fullName, role });

          // Try automatic sign in
          try {
            await AuthService.signIn({ email, password });
            authAlert.className = 'auth-alert success';
            authAlert.innerText = 'Account created! Redirecting to your portal...';

            setTimeout(async () => {
              await AuthService.routeUserByRole();
            }, 1000);

          } catch (loginErr) {
            // Redirect to verify email page
            window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
          }

        } catch (err) {
          authAlert.className = 'auth-alert error';
          authAlert.innerText = err.message || 'An error occurred during registration.';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Create Free Account';
        }
      });
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
