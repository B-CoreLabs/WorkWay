<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Search — WorkWay Recruiter Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .page-wrapper { padding: 100px 0 80px; }
      .candidate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 28px; }
      .candidate-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: var(--shadow-sm);
        transition: all var(--transition-normal);
      }
      .candidate-card:hover { border-color: var(--brand-blue); box-shadow: var(--shadow-md); transform: translateY(-2px); }
      .candidate-avatar-lg {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: var(--brand-blue);
        color: #fff;
        font-size: 1.3rem; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 14px;
      }
      .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
      .filter-select { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 9px 14px; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 600; font-family: 'Montserrat', sans-serif; cursor: pointer; outline: none; }
      .filter-select:hover { border-color: var(--brand-blue); }
    </style>
  </head>
  <body>
    <header class="site-header scrolled">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="recruiter-dashboard.html">Dashboard</a>
          <a href="manage-jobs.html">Manage Jobs</a>
          <a href="post-job.html">Post Job</a>
          <a href="messages.html">Messages</a>
        </nav>
        <div class="nav-actions"></div>
      </div>
    </header>

    <main class="page-wrapper">
      <div class="container">
        <div style="margin-bottom:20px;">
          <h1 style="font-size:1.8rem;font-weight:800;color:var(--text-primary);">AI Candidate Search</h1>
          <p style="color:var(--text-muted);font-size:0.9rem;">Browse AI-matched candidates by skills, experience, and sector</p>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="Search by name, skill, or keyword..." class="form-control" style="max-width:300px;padding:9px 14px;border-radius:var(--radius-full);border:1px solid var(--border-color);" oninput="filterCandidates()" />
          <select id="filterLocation" class="filter-select" onchange="filterCandidates()">
            <option value="">All Locations</option>
            <option value="Yaoundé">Yaoundé</option>
            <option value="Douala">Douala</option>
            <option value="Remote">Remote</option>
          </select>
          <select id="filterExp" class="filter-select" onchange="filterCandidates()">
            <option value="">All Experience</option>
            <option value="0-2">0 – 2 yrs</option>
            <option value="3-5">3 – 5 yrs</option>
            <option value="5+">5+ yrs</option>
          </select>
          <div style="margin-left:auto;font-size:0.85rem;color:var(--text-muted);font-weight:600;" id="resultsMeta">Loading...</div>
        </div>

        <div class="candidate-grid" id="candidateGrid">
          <!-- Skeleton loaders -->
          <div class="candidate-card"><div class="skeleton" style="width:56px;height:56px;border-radius:50%;margin-bottom:14px;"></div><div class="skeleton skel-row" style="width:70%;height:14px;margin-bottom:8px;"></div><div class="skeleton skel-row" style="width:50%;height:11px;"></div></div>
          <div class="candidate-card"><div class="skeleton" style="width:56px;height:56px;border-radius:50%;margin-bottom:14px;"></div><div class="skeleton skel-row" style="width:70%;height:14px;margin-bottom:8px;"></div><div class="skeleton skel-row" style="width:50%;height:11px;"></div></div>
          <div class="candidate-card"><div class="skeleton" style="width:56px;height:56px;border-radius:50%;margin-bottom:14px;"></div><div class="skeleton skel-row" style="width:70%;height:14px;margin-bottom:8px;"></div><div class="skeleton skel-row" style="width:50%;height:11px;"></div></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase } from './js/supabase-config.js';
      import { AuthService } from './js/services/auth.service.js';

      let allCandidates = [];

      document.addEventListener('DOMContentLoaded', async () => {
        const user = await AuthService.getCurrentProfile();
        if (!user) { window.location.href = 'login.html'; return; }

        // Load profiles with role = job_seeker who have skills
        const { data } = await supabase
          .from('profiles')
          .select('*, candidate_profiles(*), candidate_skills(*)')
          .eq('role', 'job_seeker')
          .limit(30);

        allCandidates = data || [];
        renderCandidates(allCandidates);
      });

      function renderCandidates(candidates) {
        const grid = document.getElementById('candidateGrid');
        document.getElementById('resultsMeta').textContent = `${candidates.length} candidate${candidates.length !== 1 ? 's' : ''} found`;

        if (candidates.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);">
            <i class="fa-solid fa-users" style="font-size:2.5rem;opacity:0.3;margin-bottom:14px;"></i>
            <p>No candidates match your current filters.</p></div>`;
          return;
        }

        grid.innerHTML = candidates.map(c => {
          const initials = (c.full_name || c.email || 'CA').split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
          const skills = c.candidate_skills?.slice(0, 4).map(s => `<span class="tag-pill" style="background:var(--bg-tag);color:var(--brand-blue);padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;margin:2px;">${s.skill_name}</span>`).join('') || '';
          const expYrs = c.experience_years || 0;
          const loc = c.location || 'Cameroon';
          return `
            <div class="candidate-card">
              <div class="candidate-avatar-lg">${initials}</div>
              <div style="font-weight:700;font-size:1rem;color:var(--text-primary);margin-bottom:2px;">${c.full_name || 'Candidate'}</div>
              <div style="font-size:0.82rem;color:var(--brand-blue);font-weight:600;margin-bottom:8px;">${c.headline || 'Seeking opportunities'}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:12px;">
                <i class="fa-solid fa-location-dot"></i> ${loc} &bull; ${expYrs} yr${expYrs !== 1 ? 's' : ''} experience
              </div>
              <div style="flex-wrap:wrap;display:flex;gap:4px;margin-bottom:16px;">${skills || '<span style="font-size:0.8rem;color:var(--text-muted);">Skills not listed</span>'}</div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" onclick="messageCandidate('${c.id}')" style="flex:1;padding:9px;font-size:0.82rem;">
                  <i class="fa-solid fa-comments"></i> Message
                </button>
                <button class="btn btn-secondary" onclick="viewProfile('${c.id}')" style="padding:9px;font-size:0.82rem;background:transparent;border-color:var(--border-color);color:var(--text-secondary);">
                  Profile
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      window.filterCandidates = function() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const loc = document.getElementById('filterLocation').value.toLowerCase();
        const expFilter = document.getElementById('filterExp').value;

        const filtered = allCandidates.filter(c => {
          const name = (c.full_name || c.email || '').toLowerCase();
          const skills = (c.candidate_skills || []).map(s => s.skill_name.toLowerCase()).join(' ');
          const headline = (c.headline || '').toLowerCase();
          const location = (c.location || '').toLowerCase();
          const years = c.experience_years || 0;

          const matchQuery = !query || name.includes(query) || skills.includes(query) || headline.includes(query);
          const matchLoc = !loc || location.includes(loc);
          const matchExp = !expFilter || (
            expFilter === '0-2' ? years <= 2 :
            expFilter === '3-5' ? years >= 3 && years <= 5 :
            expFilter === '5+' ? years >= 5 : true
          );
          return matchQuery && matchLoc && matchExp;
        });

        renderCandidates(filtered);
      };

      window.messageCandidate = function(userId) {
        window.location.href = `messages.html?user=${userId}`;
      };

      window.viewProfile = function(userId) {
        window.location.href = `profile.html?id=${userId}`;
      };
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
