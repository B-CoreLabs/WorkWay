<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email — WorkWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .auth-wrapper {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px;
      }
      .verify-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 520px;
        padding: 48px 40px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .verify-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-gold) 100%);
      }
      .icon-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--brand-blue-light);
        color: var(--brand-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        margin: 0 auto 24px;
      }
      .verify-card h1 {
        font-size: 1.7rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 12px;
      }
      .verify-card p {
        font-size: 0.95rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .user-email-badge {
        display: inline-block;
        background: var(--bg-tag);
        padding: 6px 16px;
        border-radius: var(--radius-full);
        font-weight: 700;
        color: var(--brand-blue);
        margin-bottom: 24px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="jobs.html">Find Jobs</a>
          <a href="recruiter.html">For Recruiters</a>
          <a href="how.html">How It Works</a>
          <a href="resources.html">Career Resources</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-secondary">Log In</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="verify-card">
        <div class="icon-circle">
          <i class="fa-regular fa-envelope-open"></i>
        </div>
        <h1>Verify Your Email</h1>
        <p>We’ve dispatched a secure verification link to your email address. Please click the link in your inbox to activate your account and start matching.</p>
        
        <div class="user-email-badge" id="displayEmail">your-email@example.com</div>

        <div style="display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto;">
          <a href="login.html" class="btn btn-primary" style="width: 100%;">
            Proceed to Log In
          </a>
          <a href="index.html" class="btn btn-secondary" style="width: 100%; background: transparent; color: var(--text-primary); border-color: var(--border-color);">
            Back to Home
          </a>
        </div>
      </div>
    </main>

    <script type="module">
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      if (email) {
        document.getElementById('displayEmail').textContent = email;
      }
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
