<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Jobs — WorkWay AI Job Matching Platform</title>
    <meta name="description" content="Discover AI-matched job opportunities in Cameroon. Search across Finance, Engineering, Healthcare, Logistics, Agriculture, Education and Technology sectors." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .jobs-page-wrapper {
        padding: 100px 0 80px;
        min-height: 100vh;
      }

      /* ── Search Hero ─────────────────────────────── */
      .search-hero {
        background: linear-gradient(135deg, var(--brand-blue) 0%, #002566 100%);
        padding: 48px 0 36px;
        margin-bottom: 0;
      }
      .search-hero h1 {
        font-size: 2rem;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .search-hero p {
        color: rgba(255,255,255,0.75);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }
      .search-bar {
        display: flex;
        gap: 12px;
        background: #ffffff;
        padding: 8px;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-lg);
        flex-wrap: wrap;
      }
      .search-bar input {
        flex: 2;
        min-width: 200px;
        border: none;
        background: transparent;
        padding: 10px 16px;
        font-size: 0.95rem;
        color: var(--text-primary);
        outline: none;
        font-family: 'Montserrat', sans-serif;
      }
      .search-bar input::placeholder { color: var(--text-muted); }
      .search-bar .sep {
        width: 1px;
        background: var(--border-subtle);
        align-self: stretch;
        margin: 6px 0;
      }

      /* ── Filter Strip ─────────────────────────────── */
      .filter-strip {
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        padding: 16px 0;
        position: sticky;
        top: 74px;
        z-index: 100;
        box-shadow: var(--shadow-sm);
      }
      .filter-strip-inner {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filter-select {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 8px 14px;
        border-radius: var(--radius-full);
        font-size: 0.82rem;
        font-weight: 600;
        font-family: 'Montserrat', sans-serif;
        cursor: pointer;
        outline: none;
        transition: border-color var(--transition-fast);
      }
      .filter-select:focus, .filter-select:hover {
        border-color: var(--brand-blue);
      }
      .results-meta {
        margin-left: auto;
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 600;
      }

      /* ── Two-Column Layout ─────────────────────────── */
      .jobs-body {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 28px;
        margin-top: 28px;
      }

      /* ── Job Card ─────────────────────────────────── */
      .job-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: all var(--transition-normal);
        margin-bottom: 16px;
        position: relative;
      }
      .job-card:hover, .job-card.selected {
        border-color: var(--brand-blue);
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }
      .job-card.selected {
        background: var(--bg-tag);
      }
      .job-card-top {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .company-logo-sm {
        width: 50px;
        height: 50px;
        border-radius: var(--radius-md);
        background: var(--brand-blue-light);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--brand-blue);
        flex-shrink: 0;
      }
      .job-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .job-company-location {
        font-size: 0.82rem;
        color: var(--text-muted);
      }
      .job-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .job-tag {
        background: var(--bg-tag);
        color: var(--brand-blue);
        padding: 4px 12px;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .job-card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .job-salary {
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--text-primary);
      }
      .save-btn {
        background: none;
        border: 1px solid var(--border-color);
        border-radius: 50%;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 0.9rem;
        transition: all var(--transition-fast);
      }
      .save-btn:hover, .save-btn.saved {
        border-color: var(--brand-gold);
        color: var(--brand-gold);
        background: var(--brand-gold-light);
      }

      /* ── Detail Panel ─────────────────────────────── */
      .job-detail-panel {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-md);
        position: sticky;
        top: 150px;
        max-height: calc(100vh - 180px);
        overflow-y: auto;
        padding: 28px;
      }
      .job-detail-panel::-webkit-scrollbar { width: 5px; }
      .job-detail-panel::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
      .detail-company-logo {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-md);
        background: var(--brand-blue-light);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--brand-blue);
        margin-bottom: 16px;
      }
      .detail-title {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .detail-meta-row {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .detail-meta-row span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .detail-section-title {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.5px;
        margin: 20px 0 10px;
      }
      .apply-btn {
        width: 100%;
        padding: 15px;
        font-size: 0.95rem;
        margin-top: 24px;
      }

      /* Skeleton Loader Cards */
      .job-skeleton {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin-bottom: 16px;
      }
      .skel-row { height: 14px; border-radius: 6px; margin-bottom: 12px; }

      @media (max-width: 900px) {
        .jobs-body {
          grid-template-columns: 1fr;
        }
        .job-detail-panel {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          max-height: 70vh;
          border-radius: var(--radius-xl) var(--radius-xl) 0 0;
          z-index: 200;
          display: none;
        }
        .job-detail-panel.mobile-open {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── Header ─────────────────────────────────────── -->
    <header class="site-header scrolled">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="jobs.html" class="active" data-i18n="nav_find_jobs">Find Jobs</a>
          <a href="recruiter.html" data-i18n="nav_recruiters">For Recruiters</a>
          <a href="how.html" data-i18n="nav_how_it_works">How It Works</a>
          <a href="resources.html" data-i18n="nav_resources">Career Resources</a>
        </nav>
        <div class="nav-actions"></div>
      </div>
    </header>

    <main class="jobs-page-wrapper">
      <!-- ── Search Hero ──────────────────────────────── -->
      <section class="search-hero">
        <div class="container">
          <h1>Discover AI-Matched Opportunities</h1>
          <p>Browse 10,000+ roles across Cameroon &amp; the African job market</p>
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); margin-left: 8px; font-size: 1.1rem;"></i>
            <input type="text" id="keywordSearch" placeholder="Job title, skills, keywords..." />
            <div class="sep"></div>
            <i class="fa-solid fa-location-dot" style="color: var(--text-muted); font-size: 1.1rem;"></i>
            <input type="text" id="locationSearch" placeholder="Location (e.g. Yaoundé, Douala, Remote)" style="flex: 1;" />
            <button id="searchBtn" class="btn btn-primary" style="border-radius: var(--radius-full);">
              <i class="fa-solid fa-magnifying-glass"></i> Search
            </button>
          </div>
        </div>
      </section>

      <!-- ── Filter Strip ─────────────────────────────── -->
      <section class="filter-strip">
        <div class="container filter-strip-inner">
          <i class="fa-solid fa-sliders" style="color: var(--brand-blue);"></i>
          <select id="filterCategory" class="filter-select">
            <option value="">All Industries</option>
            <option value="Finance & Accounting">Finance &amp; Accounting</option>
            <option value="Engineering & Civil Construction">Engineering &amp; Construction</option>
            <option value="Medicine & Healthcare">Medicine &amp; Healthcare</option>
            <option value="Logistics & Supply Chain">Logistics &amp; Supply Chain</option>
            <option value="Agriculture & Agro-Industry">Agriculture &amp; Agro-Industry</option>
            <option value="Education & Training">Education &amp; Training</option>
            <option value="Technology & Software">Technology &amp; Software</option>
          </select>
          <select id="filterType" class="filter-select">
            <option value="">All Types</option>
            <option value="full_time">Full-Time</option>
            <option value="part_time">Part-Time</option>
            <option value="contract">Contract</option>
            <option value="internship">Internship</option>
          </select>
          <select id="filterMode" class="filter-select">
            <option value="">Any Work Mode</option>
            <option value="remote">Remote</option>
            <option value="on_site">On-Site</option>
            <option value="hybrid">Hybrid</option>
          </select>
          <select id="filterLevel" class="filter-select">
            <option value="">All Experience Levels</option>
            <option value="entry">Entry Level</option>
            <option value="mid">Mid Level</option>
            <option value="senior">Senior</option>
            <option value="lead">Lead / Executive</option>
          </select>
          <div class="results-meta" id="resultsMeta">Loading jobs...</div>
        </div>
      </section>

      <!-- ── Jobs Body ──────────────────────────────── -->
      <div class="container">
        <div class="jobs-body">
          <!-- Left: Jobs List -->
          <div>
            <div id="jobsList">
              <!-- Skeleton placeholders -->
              ${[1,2,3,4].map(() => `
              <div class="job-skeleton">
                <div class="skeleton skel-row" style="width: 60%;"></div>
                <div class="skeleton skel-row" style="width: 40%;"></div>
                <div class="skeleton skel-row" style="width: 80%; height: 10px;"></div>
              </div>`).join('')}
            </div>
          </div>

          <!-- Right: Detail Panel -->
          <aside>
            <div class="job-detail-panel" id="jobDetailPanel">
              <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                <i class="fa-solid fa-hand-pointer" style="font-size: 2.5rem; margin-bottom: 14px; opacity: 0.3;"></i>
                <p>Select a job to view full details</p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase } from './js/supabase-config.js';
      import { AuthService } from './js/services/auth.service.js';
      import { AIMatcher } from './js/ai-matcher.js';

      let allJobs = [];
      let savedJobIds = new Set();
      let currentUser = null;

      // ── Format salary helper ──────────────────────
      function formatSalary(min, max, currency = 'XAF') {
        const fmt = (n) => n >= 1000000 ? `${(n/1000000).toFixed(1)}M` : `${Math.round(n/1000)}K`;
        return `${fmt(min)} – ${fmt(max)} ${currency}/mo`;
      }

      // ── Match badge ───────────────────────────────
      function matchBadge(score) {
        const cls = score >= 85 ? 'high' : score >= 70 ? 'mid' : 'low';
        return `<span class="match-badge ${cls}"><i class="fa-solid fa-circle-check"></i> ${score}% Match</span>`;
      }

      // ── Render Jobs List ──────────────────────────
      function renderJobs(jobs) {
        const container = document.getElementById('jobsList');
        document.getElementById('resultsMeta').textContent = `${jobs.length} position${jobs.length !== 1 ? 's' : ''} found`;

        if (jobs.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
              <i class="fa-solid fa-briefcase" style="font-size: 2.5rem; opacity: 0.3; margin-bottom: 14px;"></i>
              <p>No jobs match your current filters. Try broadening your search.</p>
            </div>`;
          return;
        }

        container.innerHTML = jobs.map((job, idx) => {
          const match = AIMatcher.calculateMatch(currentUser, job);
          const initials = job.company_name ? job.company_name.substring(0, 2).toUpperCase() : 'WW';
          const isSaved = savedJobIds.has(job.id);

          return `
            <div class="job-card" id="card-${idx}" onclick="selectJob(${idx})">
              <div class="job-card-top">
                <div class="company-logo-sm">${initials}</div>
                <div style="flex: 1;">
                  <div class="job-title">${job.title}</div>
                  <div class="job-company-location">${job.company_name || 'Company'} &bull; ${job.location}</div>
                </div>
                ${matchBadge(match.overallScore)}
              </div>
              <div class="job-tags">
                <span class="job-tag"><i class="fa-solid fa-briefcase" style="font-size: 0.7rem;"></i> ${job.job_type?.replace('_',' ')}</span>
                <span class="job-tag"><i class="fa-solid fa-building" style="font-size: 0.7rem;"></i> ${job.work_mode?.replace('_',' ')}</span>
                ${job.category ? `<span class="job-tag">${job.category}</span>` : ''}
              </div>
              <div class="job-card-footer">
                <span class="job-salary">${formatSalary(job.salary_min, job.salary_max, job.salary_currency)}</span>
                <button class="save-btn ${isSaved ? 'saved' : ''}" id="savebtn-${idx}" onclick="toggleSave(event, ${idx})" title="${isSaved ? 'Saved' : 'Save Job'}">
                  <i class="fa-${isSaved ? 'solid' : 'regular'} fa-bookmark"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      // ── Render Job Detail Panel ───────────────────
      window.selectJob = function(idx) {
        const job = allJobs[idx];
        if (!job) return;

        document.querySelectorAll('.job-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`card-${idx}`)?.classList.add('selected');

        const match = AIMatcher.calculateMatch(currentUser, job);
        const initials = job.company_name ? job.company_name.substring(0, 2).toUpperCase() : 'WW';

        document.getElementById('jobDetailPanel').innerHTML = `
          <div class="detail-company-logo">${initials}</div>
          <div class="detail-title">${job.title}</div>
          <div class="detail-meta-row">
            <span><i class="fa-solid fa-building"></i> ${job.company_name || 'Company'}</span>
            <span><i class="fa-solid fa-location-dot"></i> ${job.location}</span>
            <span><i class="fa-solid fa-clock"></i> ${job.job_type?.replace('_',' ')}</span>
          </div>

          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
            ${matchBadge(match.overallScore)}
            <span class="job-tag"><i class="fa-solid fa-money-bill"></i> ${formatSalary(job.salary_min, job.salary_max, job.salary_currency)}</span>
            <span class="job-tag">${job.work_mode?.replace('_',' ')}</span>
          </div>

          ${match.reasons.length > 0 ? `
            <div style="background: var(--bg-tag); border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px;">
              <strong style="font-size: 0.82rem; color: var(--brand-blue);">Why this matches you:</strong>
              <ul style="margin-top: 6px; padding-left: 18px; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7;">
                ${match.reasons.map(r => `<li>${r}</li>`).join('')}
              </ul>
            </div>
          ` : ''}

          <div class="detail-section-title">About the Role</div>
          <p style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7;">${job.description || 'Full position details available upon application.'}</p>

          ${job.responsibilities?.length ? `
            <div class="detail-section-title">Key Responsibilities</div>
            <ul style="padding-left: 18px; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.8;">
              ${job.responsibilities.map(r => `<li>${r}</li>`).join('')}
            </ul>` : ''}

          ${job.requirements?.length ? `
            <div class="detail-section-title">Requirements</div>
            <ul style="padding-left: 18px; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.8;">
              ${job.requirements.map(r => `<li>${r}</li>`).join('')}
            </ul>` : ''}

          ${job.skills_required?.length ? `
            <div class="detail-section-title">Skills Required</div>
            <div>${job.skills_required.map(s => `<span class="job-tag" style="margin: 3px;">${s}</span>`).join(' ')}</div>` : ''}

          <button class="btn btn-primary apply-btn" onclick="applyToJob('${job.id}', '${(job.title || '').replace(/'/g, "\\'")}')">
            <i class="fa-solid fa-paper-plane"></i> Quick Apply to ${job.title}
          </button>
          <a href="job-detail.html?id=${job.id}" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 10px;">View Full Posting</a>
        `;

        const panel = document.getElementById('jobDetailPanel');
        panel.classList.add('mobile-open');
        window.scrollTo({ top: 200, behavior: 'smooth' });
      };

      // ── Toggle Save Job ───────────────────────────
      window.toggleSave = async function(e, idx) {
        e.stopPropagation();
        if (!currentUser) {
          window.location.href = 'login.html';
          return;
        }
        const job = allJobs[idx];
        const btn = document.getElementById(`savebtn-${idx}`);
        const isSaved = savedJobIds.has(job.id);

        if (isSaved) {
          await supabase.from('saved_jobs').delete().eq('user_id', currentUser.id).eq('job_id', job.id);
          savedJobIds.delete(job.id);
          btn.className = 'save-btn';
          btn.innerHTML = '<i class="fa-regular fa-bookmark"></i>';
        } else {
          await supabase.from('saved_jobs').insert({ user_id: currentUser.id, job_id: job.id });
          savedJobIds.add(job.id);
          btn.className = 'save-btn saved';
          btn.innerHTML = '<i class="fa-solid fa-bookmark"></i>';
        }
      };

      // ── Apply to Job ──────────────────────────────
      window.applyToJob = async function(jobId, jobTitle) {
        if (!currentUser) {
          window.location.href = 'login.html';
          return;
        }
        const { error } = await supabase.from('job_applications').upsert({
          job_id: jobId,
          applicant_id: currentUser.id,
          status: 'applied'
        }, { onConflict: 'job_id,applicant_id' });

        if (!error) {
          alert(`✅ Application submitted for: ${jobTitle}! You can track it in My Applications.`);
        } else {
          alert('You have already applied to this position.');
        }
      };

      // ── Load & Filter Jobs ────────────────────────
      async function loadJobs() {
        let query = supabase.from('jobs').select(`
          *,
          companies (name, industry, website)
        `).eq('is_active', true).order('is_featured', { ascending: false }).order('created_at', { ascending: false });

        const cat = document.getElementById('filterCategory').value;
        const type = document.getElementById('filterType').value;
        const mode = document.getElementById('filterMode').value;
        const level = document.getElementById('filterLevel').value;
        const keyword = document.getElementById('keywordSearch').value.trim().toLowerCase();
        const location = document.getElementById('locationSearch').value.trim().toLowerCase();

        if (cat) query = query.eq('category', cat);
        if (type) query = query.eq('job_type', type);
        if (mode) query = query.eq('work_mode', mode);
        if (level) query = query.eq('experience_level', level);

        const { data, error } = await query.limit(40);

        if (error) {
          console.error('Error loading jobs:', error.message);
          return;
        }

        let jobs = (data || []).map(job => ({
          ...job,
          company_name: job.companies?.name || job.company_name || 'Company'
        }));

        // Client-side keyword/location filter
        if (keyword) {
          jobs = jobs.filter(j =>
            j.title?.toLowerCase().includes(keyword) ||
            j.description?.toLowerCase().includes(keyword) ||
            (j.skills_required || []).some(s => s.toLowerCase().includes(keyword))
          );
        }
        if (location) {
          jobs = jobs.filter(j =>
            j.location?.toLowerCase().includes(location) ||
            j.is_remote
          );
        }

        allJobs = jobs;
        renderJobs(allJobs);

        // Auto-select first job
        if (allJobs.length > 0) {
          setTimeout(() => selectJob(0), 200);
        }
      }

      // ── Fetch saved job IDs ───────────────────────
      async function fetchSavedJobs() {
        if (!currentUser) return;
        const { data } = await supabase.from('saved_jobs').select('job_id').eq('user_id', currentUser.id);
        savedJobIds = new Set((data || []).map(s => s.job_id));
      }

      // ── Init ──────────────────────────────────────
      document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await AuthService.getCurrentProfile();
        await fetchSavedJobs();
        await loadJobs();

        // Filter event listeners
        ['filterCategory', 'filterType', 'filterMode', 'filterLevel'].forEach(id => {
          document.getElementById(id)?.addEventListener('change', loadJobs);
        });

        document.getElementById('searchBtn')?.addEventListener('click', loadJobs);
        document.getElementById('keywordSearch')?.addEventListener('keydown', e => { if (e.key === 'Enter') loadJobs(); });
      });
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
