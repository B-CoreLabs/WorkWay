<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruiter &amp; Employer Hub — WorkWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../WorkWay Images/WorkWayLogo 2.png" />
    <style>
      body {
        background: #f4f7fb;
      }
      .portal-header {
        background: #ffffff;
        border-bottom: 1px solid rgba(1, 69, 178, 0.1);
        padding: 16px 0;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .portal-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .portal-logo img {
        height: 42px;
      }
      .portal-layout {
        max-width: 1360px;
        margin: 30px auto 60px;
        padding: 0 20px;
      }
      .stat-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      .stat-card {
        background: #ffffff;
        border-radius: 18px;
        padding: 24px;
        border: 1px solid rgba(1, 69, 178, 0.08);
        box-shadow: 0 10px 25px rgba(1, 69, 178, 0.05);
      }
      .stat-card h4 {
        font-size: 0.8rem;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat-card .val {
        font-size: 2rem;
        font-weight: 800;
        color: #0145b2;
      }
      .dashboard-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 28px;
        border: 1px solid rgba(1, 69, 178, 0.08);
        box-shadow: 0 10px 30px rgba(1, 69, 178, 0.06);
        margin-bottom: 30px;
      }
      .card-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid #f1f5f9;
        flex-wrap: wrap;
        gap: 12px;
      }
      .jobs-table {
        width: 100%;
        border-collapse: collapse;
      }
      .jobs-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 0.78rem;
        text-transform: uppercase;
        color: #64748b;
        background: #f8fafc;
        border-radius: 8px;
      }
      .jobs-table td {
        padding: 16px;
        border-bottom: 1px solid #edf2f7;
        font-size: 0.9rem;
      }
      /* Modal styles */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }
      .modal-backdrop.active {
        display: flex;
      }
      .modal-card {
        background: #ffffff;
        border-radius: 20px;
        max-width: 650px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 32px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 1.3rem;
        cursor: pointer;
        color: #64748b;
      }
      .applicant-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .status-select {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid #cbd5e1;
        font-size: 0.82rem;
        font-weight: 600;
        outline: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Top Nav -->
    <header class="portal-header">
      <div class="container portal-nav">
        <a href="../index.html" class="portal-logo">
          <img src="../WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" />
        </a>
        <div style="display: flex; align-items: center; gap: 14px;">
          <button id="openPostJobBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Post New Vacancy</button>
          <button id="logoutBtn" class="btn btn-outline btn-sm">Log Out</button>
        </div>
      </div>
    </header>

    <div class="portal-layout">
      <!-- Stat Strip -->
      <div class="stat-strip">
        <div class="stat-card">
          <h4>Active Vacancies</h4>
          <div class="val" id="statActiveJobs">0</div>
        </div>
        <div class="stat-card">
          <h4>Total Applicants</h4>
          <div class="val" id="statTotalApplicants">0</div>
        </div>
        <div class="stat-card">
          <h4>In Interview Stage</h4>
          <div class="val" id="statInterviews">0</div>
        </div>
      </div>

      <!-- Recruiter Vacancies Table -->
      <div class="dashboard-card">
        <div class="card-header-flex">
          <h3 style="font-size: 1.25rem; font-weight: 700; color: #1a1a1a;">
            <i class="fa-solid fa-briefcase" style="color: #0145b2; margin-right: 8px;"></i> Posted Job Vacancies
          </h3>
          <span id="jobsCountBadge" style="font-size: 0.85rem; color: #64748b;">0 vacancies</span>
        </div>

        <div id="jobsTableContainer" style="overflow-x: auto;">
          <p style="text-align: center; color: #64748b; padding: 30px;">Loading your posted vacancies...</p>
        </div>
      </div>
    </div>

    <!-- Post Job Modal -->
    <div id="postJobModal" class="modal-backdrop">
      <div class="modal-card">
        <button id="closePostJobBtn" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h2 style="font-size: 1.4rem; color: #0145b2; margin-bottom: 6px;">Post a New Vacancy</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Publish an opportunity to reach qualified talent</p>

        <form id="postJobForm">
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">JOB TITLE</label>
            <input type="text" id="jobTitle" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;" placeholder="e.g. Senior Frontend Developer" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">EMPLOYMENT TYPE</label>
              <select id="jobType" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;">
                <option value="full_time">Full-Time</option>
                <option value="part_time">Part-Time</option>
                <option value="contract">Contract</option>
                <option value="remote">Remote</option>
                <option value="internship">Internship</option>
              </select>
            </div>
            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">LOCATION</label>
              <input type="text" id="jobLocation" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;" placeholder="City or Remote" required />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">MIN SALARY ($/year)</label>
              <input type="number" id="salaryMin" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;" placeholder="e.g. 90000" />
            </div>
            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">MAX SALARY ($/year)</label>
              <input type="number" id="salaryMax" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;" placeholder="e.g. 130000" />
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">REQUIRED SKILLS (comma-separated)</label>
            <input type="text" id="skillsRequired" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;" placeholder="React, TypeScript, CSS, PostgreSQL" />
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px;">JOB DESCRIPTION</label>
            <textarea id="jobDescription" rows="4" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 0.9rem;" placeholder="Role overview, responsibilities, and team context..." required></textarea>
          </div>

          <button type="submit" id="submitJobBtn" class="btn btn-primary" style="width: 100%;">
            Publish Job Vacancy
          </button>
        </form>
      </div>
    </div>

    <!-- ATS Candidate Review Modal -->
    <div id="atsModal" class="modal-backdrop">
      <div class="modal-card">
        <button id="closeAtsBtn" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h2 id="atsJobTitle" style="font-size: 1.4rem; color: #0145b2; margin-bottom: 6px;">Candidate Pipeline</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Review and manage applicant statuses</p>

        <div id="applicantsContainer">
          <p style="text-align: center; color: #64748b; padding: 20px;">Loading applicants...</p>
        </div>
      </div>
    </div>

    <script type="module">
      import { AuthService } from '../js/services/auth.service.js';
      import { JobService } from '../js/services/jobs.service.js';
      import { ApplicationService } from '../js/services/applications.service.js';
      import { ProfileService } from '../js/services/profiles.service.js';

      let currentUser = null;
      let userCompany = null;

      const openPostJobBtn = document.getElementById('openPostJobBtn');
      const closePostJobBtn = document.getElementById('closePostJobBtn');
      const postJobModal = document.getElementById('postJobModal');
      const postJobForm = document.getElementById('postJobForm');
      const submitJobBtn = document.getElementById('submitJobBtn');

      const atsModal = document.getElementById('atsModal');
      const closeAtsBtn = document.getElementById('closeAtsBtn');
      const atsJobTitle = document.getElementById('atsJobTitle');
      const applicantsContainer = document.getElementById('applicantsContainer');

      async function init() {
        currentUser = await AuthService.getCurrentProfile();
        if (!currentUser) {
          window.location.href = '/login.html';
          return;
        }

        // Ensure recruiter has a company entity
        userCompany = await ProfileService.getOrCreateCompany(currentUser.id, {
          name: currentUser.full_name ? `${currentUser.full_name}'s Organization` : 'WorkWay Partner',
          description: 'Hiring top verified talent on WorkWay'
        });

        await loadRecruiterJobs();
      }

      async function loadRecruiterJobs() {
        const container = document.getElementById('jobsTableContainer');
        try {
          const jobs = await JobService.getRecruiterJobs(currentUser.id);
          document.getElementById('statActiveJobs').innerText = jobs.length;
          document.getElementById('jobsCountBadge').innerText = `${jobs.length} vacancies`;

          let totalApps = 0;
          let interviewApps = 0;

          jobs.forEach(j => {
            if (Array.isArray(j.job_applications)) {
              totalApps += j.job_applications.length;
              interviewApps += j.job_applications.filter(a => a.status === 'interviewing').length;
            }
          });

          document.getElementById('statTotalApplicants').innerText = totalApps;
          document.getElementById('statInterviews').innerText = interviewApps;

          if (jobs.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; padding: 40px 20px;">
                <p style="color: #64748b; margin-bottom: 16px;">You haven't posted any vacancies yet.</p>
                <button id="emptyPostBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Post Your First Vacancy</button>
              </div>
            `;
            document.getElementById('emptyPostBtn')?.addEventListener('click', () => {
              postJobModal.classList.add('active');
            });
            return;
          }

          let html = `
            <table class="jobs-table">
              <thead>
                <tr>
                  <th>Job Title</th>
                  <th>Type</th>
                  <th>Location</th>
                  <th>Applicants</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
          `;

          jobs.forEach(j => {
            const appsCount = Array.isArray(j.job_applications) ? j.job_applications.length : 0;
            html += `
              <tr>
                <td><strong>${j.title}</strong></td>
                <td>${(j.job_type || 'full_time').replace('_', ' ').toUpperCase()}</td>
                <td>${j.location}</td>
                <td><span style="font-weight: 700; color: #0145b2;">${appsCount}</span> candidates</td>
                <td>
                  <button class="btn btn-secondary btn-sm view-candidates-btn" data-id="${j.id}" data-title="${j.title}" style="padding: 6px 14px; font-size: 0.75rem;">
                    <i class="fa-solid fa-users"></i> Review (${appsCount})
                  </button>
                </td>
              </tr>
            `;
          });

          html += `</tbody></table>`;
          container.innerHTML = html;

          document.querySelectorAll('.view-candidates-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              openAtsPipeline(btn.dataset.id, btn.dataset.title);
            });
          });

        } catch (err) {
          container.innerHTML = `<p style="color: #e53e3e;">Failed to load vacancies: ${err.message}</p>`;
        }
      }

      async function openAtsPipeline(jobId, jobTitle) {
        atsJobTitle.innerText = `${jobTitle} — Candidates`;
        applicantsContainer.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading candidates...</p>';
        atsModal.classList.add('active');

        try {
          const applicants = await ApplicationService.getJobApplicants(jobId);
          if (applicants.length === 0) {
            applicantsContainer.innerHTML = '<p style="text-align: center; color: #64748b; padding: 30px;">No candidates have applied to this vacancy yet.</p>';
            return;
          }

          applicantsContainer.innerHTML = '';
          applicants.forEach(app => {
            const profile = app.profiles || { full_name: 'Applicant', email: 'applicant@workway.com' };
            const card = document.createElement('div');
            card.className = 'applicant-card';
            card.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                <div>
                  <h4 style="font-size: 1.05rem; color: #1a1a1a; margin: 0 0 2px 0;">${profile.full_name || 'Candidate'}</h4>
                  <p style="font-size: 0.82rem; color: #64748b; margin: 0;">${profile.headline || profile.email}</p>
                </div>
                <select class="status-select" data-app-id="${app.id}">
                  <option value="applied" ${app.status === 'applied' ? 'selected' : ''}>Applied</option>
                  <option value="reviewing" ${app.status === 'reviewing' ? 'selected' : ''}>Reviewing</option>
                  <option value="shortlisted" ${app.status === 'shortlisted' ? 'selected' : ''}>Shortlisted</option>
                  <option value="interviewing" ${app.status === 'interviewing' ? 'selected' : ''}>Interviewing</option>
                  <option value="offered" ${app.status === 'offered' ? 'selected' : ''}>Offered</option>
                  <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                </select>
              </div>
              <p style="font-size: 0.85rem; color: #4a5568; margin-bottom: 10px;">${app.cover_letter ? `"${app.cover_letter}"` : 'No cover letter attached.'}</p>
              ${app.resume_url ? `<a href="${app.resume_url}" target="_blank" class="btn btn-outline btn-sm" style="padding: 4px 12px; font-size: 0.72rem;"><i class="fa-solid fa-file-pdf"></i> View Resume</a>` : ''}
            `;
            applicantsContainer.appendChild(card);
          });

          // Attach status change listeners
          document.querySelectorAll('.status-select').forEach(sel => {
            sel.addEventListener('change', async (e) => {
              const newStatus = e.target.value;
              const appId = e.target.dataset.appId;
              try {
                await ApplicationService.updateApplicationStatus(appId, newStatus);
              } catch (err) {
                alert('Could not update status: ' + err.message);
              }
            });
          });

        } catch (err) {
          applicantsContainer.innerHTML = `<p style="color: #e53e3e;">Failed to load candidate pipeline: ${err.message}</p>`;
        }
      }

      openPostJobBtn.addEventListener('click', () => {
        postJobModal.classList.add('active');
      });

      closePostJobBtn.addEventListener('click', () => {
        postJobModal.classList.remove('active');
      });

      closeAtsBtn.addEventListener('click', () => {
        atsModal.classList.remove('active');
        loadRecruiterJobs();
      });

      postJobForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitJobBtn.disabled = true;
        submitJobBtn.innerText = 'Publishing vacancy...';

        try {
          const title = document.getElementById('jobTitle').value.trim();
          const job_type = document.getElementById('jobType').value;
          const location = document.getElementById('jobLocation').value.trim();
          const salary_min = document.getElementById('salaryMin').value ? Number(document.getElementById('salaryMin').value) : null;
          const salary_max = document.getElementById('salaryMax').value ? Number(document.getElementById('salaryMax').value) : null;
          const description = document.getElementById('jobDescription').value.trim();
          const skillsRaw = document.getElementById('skillsRequired').value.trim();
          const skills_required = skillsRaw ? skillsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

          await JobService.createJob({
            title,
            job_type,
            location,
            salary_min,
            salary_max,
            description,
            skills_required,
            company_id: userCompany.id,
            recruiter_id: currentUser.id,
            is_active: true
          });

          postJobForm.reset();
          postJobModal.classList.remove('active');
          submitJobBtn.disabled = false;
          submitJobBtn.innerText = 'Publish Job Vacancy';
          
          await loadRecruiterJobs();
        } catch (err) {
          alert('Error posting job: ' + err.message);
          submitJobBtn.disabled = false;
          submitJobBtn.innerText = 'Publish Job Vacancy';
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await AuthService.signOut();
      });

      init();
    </script>
  </body>
</html>
