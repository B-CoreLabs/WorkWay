<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — WorkWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style (2).css" />
    <link rel="stylesheet" href="css/core-design-system.css" />
    <link rel="icon" type="image/x-icon" href="WorkWay Images/WorkWayLogo 2.png" />
    <style>
      .auth-wrapper {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px;
      }
      .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 500px;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }
      .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-gold) 100%);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .auth-header p {
        font-size: 0.92rem;
        color: var(--text-muted);
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-secondary);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--border-subtle);
        background: var(--bg-input);
        color: var(--text-primary);
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        outline: none;
        transition: border-color var(--transition-fast);
      }
      .form-control:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 4px rgba(1, 69, 178, 0.12);
      }
      .auth-alert {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        font-size: 0.88rem;
        margin-bottom: 20px;
        display: none;
      }
      .auth-alert.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        display: block;
      }
      .auth-alert.success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        display: block;
      }
      .auth-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .auth-footer a {
        color: var(--brand-blue);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="WorkWay Images/Workwaylogo.png" alt="WorkWay Logo" width="200" height="150" />
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="jobs.html">Find Jobs</a>
          <a href="recruiter.html">For Recruiters</a>
          <a href="how.html">How It Works</a>
          <a href="resources.html">Career Resources</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-secondary">Log In</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Reset Password</h1>
          <p>Enter your registered email address to receive recovery instructions</p>
        </div>

        <div id="authAlert" class="auth-alert"></div>

        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Account Email</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 14px;">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="login.html">Return to Log In</a>
        </div>
      </div>
    </main>

    <script type="module">
      import { AuthService } from './js/services/auth.service.js';

      const forgotForm = document.getElementById('forgotForm');
      const submitBtn = document.getElementById('submitBtn');
      const authAlert = document.getElementById('authAlert');

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authAlert.className = 'auth-alert';
        authAlert.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending instructions...';

        try {
          await AuthService.resetPasswordForEmail(email);
          authAlert.className = 'auth-alert success';
          authAlert.innerHTML = `
            <strong>Reset link dispatched!</strong><br>
            Check your inbox at <strong>${email}</strong> for instructions to create a new password.
          `;
          submitBtn.innerText = 'Email Sent';
        } catch (err) {
          authAlert.className = 'auth-alert error';
          authAlert.innerText = err.message || 'Could not send reset email.';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Send Reset Link';
        }
      });
    </script>
    <script type="module" src="js/nav-auth.js"></script>
  </body>
</html>
